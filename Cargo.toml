[workspace]
resolver = "2"
members = [
    "crates/bana-types",
    "crates/bana-env-scanner",
    "crates/bana-toolchain-mgr",
    "crates/bana-project-analyzer",
    "crates/bana-plugin-api",
    "crates/bana-build-driver",
    "crates/bana-output-validator",
    "crates/bana-ffi",
]

# اطلاعات مشترک همه‌ی کریت‌های workspace، برای جلوگیری از پراکندگی نسخه
# Shared metadata for every workspace crate, to avoid version drift
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/msoleimani62/bana"
authors = ["msoleimani62"]

# وابستگی‌های مشترک؛ هر کریت با workspace = true بهشون وصل می‌شه
# Shared dependencies; each crate opts in via workspace = true
[workspace.dependencies]
bana-types = { path = "crates/bana-types" }
bana-plugin-api = { path = "crates/bana-plugin-api" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
